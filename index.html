<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>けいさんバトル</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f4f7fb;color:#172033}.app{max-width:620px;margin:auto;min-height:100vh;padding:18px}button{font:inherit;cursor:pointer;border:0}h1{text-align:center;font-size:30px;margin:10px 0 22px}h2{text-align:center;margin:12px 0 8px}.sub{text-align:center;color:#667085;margin:0 0 18px}.grid{display:grid;gap:12px}.card,.mode,.choice{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 12px #00000012}.card{text-align:left;border:3px solid transparent}.card.selected{border-color:#2563eb;background:#eff6ff}.card b{font-size:22px;display:block;margin-bottom:6px}.card small{font-size:15px;color:#667085}.mode{min-height:86px}.mode b{font-size:20px;display:block}.mode small{color:#667085}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{text-align:center;font-weight:700;font-size:20px;padding:16px}.primary{background:#2563eb;color:#fff;border-radius:16px;padding:16px;width:100%;font-weight:800;font-size:21px}.secondary{background:#e5e7eb;border-radius:14px;padding:12px;width:100%;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;font-weight:800}.timer{font-size:25px}.problem{background:#fff;border-radius:25px;min-height:240px;display:flex;align-items:center;justify-content:center;font-size:76px;font-weight:900;box-shadow:0 5px 20px #00000012;margin:15px 0 18px}.next{width:100%;padding:22px;border-radius:20px;background:#111827;color:#fff;font-size:30px;font-weight:900}.center{text-align:center}.result{font-size:42px;font-weight:900;text-align:center;margin:30px 0}.hidden{display:none}.history{margin-top:18px;background:#fff;border-radius:16px;padding:14px}.history div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}
</style></head><body><div class="app"><div id="setScreen"><h1>けいさんバトル</h1><h2>もんだいセットを えらんでね</h2><p class="sub">ふくすうえらべるよ</p><div id="sets" class="grid"></div><button class="primary" onclick="goMode()">つぎへ！</button></div><div id="modeScreen" class="hidden"><h1>けいさんバトル</h1><div class="grid"><div class="mode"><b>かずチャレンジ</b><small>なんこ ぶったおす？</small><div class="row" style="margin-top:10px"><button class="choice" onclick="startCount(10)">10</button><button class="choice" onclick="startCount(15)">15</button><button class="choice" onclick="startCount(20)">20</button></div></div><div class="mode"><b>じかんチャレンジ</b><small>じかんないに なんこ ぶったおせる？</small><div class="row" style="margin-top:10px"><button class="choice" onclick="startTime(20)">20秒</button><button class="choice" onclick="startTime(30)">30秒</button><button class="choice" onclick="startTime(40)">40秒</button></div></div><div class="mode" onclick="startRecord()"><b>きろくチャレンジ</b><small>20こ ぶったおす じかんチャレンジ！〜てきは きのうの おれ〜</small></div></div><button class="secondary" style="margin-top:14px" onclick="backSets()">もどる</button></div><div id="playScreen" class="hidden"><div class="top"><span id="progress"></span><span id="timer" class="timer"></span></div><div id="problem" class="problem"></div><button class="next" onclick="nextProblem()">つぎ！</button></div><div id="resultScreen" class="hidden"><h1>けっか！</h1><div id="result" class="result"></div><div id="history" class="history hidden"></div><button class="primary" onclick="backSets()">もういっかい</button></div></div><script>
const SETS=[
{title:'たしざん（1）',desc:'こたえが10までのたしざんです。',problems:['1+0','4+3','4+1','9+1','1+6','3+1','6+1','7+3','4+0','7+0','8+2','2+6','2+1','1+8','4+2','5+5','8+1','5+1','7+2','1+9','3+5','3+0','5+0','1+1','2+0','6+3','3+6','2+8','5+4','7+1','6+4','6+2','5+3','2+7','3+3','4+4','9+0','5+2','2+2','8+0','2+5','4+5','2+3','1+2','3+4','4+6','2+4','1+3','1+4','6+0','1+5','3+7','1+7','3+2']},
{title:'たしざん（2）',desc:'くりあがりのある たしざんです。',problems:['9+3','9+4','5+6','8+3','8+4','4+9','3+8','3+9','7+6','7+7','4+7','4+8','9+2','8+7','8+5','8+6','7+8','7+9','6+8','6+9','7+4','7+5','8+8','9+5','9+6','9+9','8+9','9+7','9+8','2+9','6+6','6+7','5+7','5+8','5+9','6+5']},
{title:'ひきざん（1）',desc:'ひかれるかずが10までの ひきざんです。',problems:['10-1','2-1','1-1','7-3','10-6','10-3','8-1','8-4','9-3','5-1','4-1','4-2','9-8','7-7','7-4','8-7','9-4','8-2','10-2','4-4','5-2','9-7','9-5','6-6','7-1','10-9','6-4','10-4','7-6','8-5','6-5','3-1','9-6','2-2','7-2','7-5','6-2','6-3','10-8','8-3','8-6','8-8','3-2','5-3','3-3','9-9','10-7','5-5','9-2','10-5','6-1','9-1','5-4','4-3']},
{title:'ひきざん（2）',desc:'くりさがりのある ひきざんです。',problems:['13-8','13-9','13-6','15-8','13-4','13-5','17-9','11-5','11-6','12-8','12-6','12-7','11-7','11-8','16-8','16-9','12-4','12-5','11-9','12-3','17-8','15-6','15-7','13-7','11-3','11-4','14-9','12-9','15-9','16-7','18-9','11-2','14-6','14-5','14-7','14-8']}
];
let selectedSets=[false,false,false,false],deck=[],index=0,mode='',target=0,count=0,timeLeft=0,interval=null,startTimeMs=0;const $=id=>document.getElementById(id);function renderSets(){$('sets').innerHTML=SETS.map((s,i)=>`<button class="card ${selectedSets[i]?'selected':''}" onclick="toggleSet(${i})"><b>${s.title}</b><small>${s.desc}</small><small style="display:block;margin-top:6px">${s.problems.length}もん</small></button>`).join('')}function toggleSet(i){selectedSets[i]=!selectedSets[i];renderSets()}function show(id){['setScreen','modeScreen','playScreen','resultScreen'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function goMode(){if(!selectedSets.some(Boolean)){alert('もんだいセットを 1ついじょう えらんでね！');return}show('modeScreen')}function backSets(){clearInterval(interval);interval=null;show('setScreen');renderSets()}function buildDeck(){deck=[];selectedSets.forEach((yes,i)=>{if(yes)deck.push(...SETS[i].problems)});for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0}function begin(m,t){mode=m;target=t;count=0;timeLeft=t;buildDeck();$('timer').textContent='';show('playScreen');showProblem()}function showProblem(){if(index>=deck.length)buildDeck();$('problem').textContent=deck[index];if(mode==='count')$('progress').textContent=`${count+1} / ${target}`;else if(mode==='record')$('progress').textContent=`${count+1} / 20`;else $('progress').textContent=`${count}こ`}function nextProblem(){count++;index++;if(mode==='count'&&count>=target){finishCount();return}if(mode==='record'&&count>=20){finishRecord();return}if(mode==='time'&&timeLeft<=0){finishTime();return}showProblem()}function startCount(n){begin('count',n)}function startTime(s){begin('time',s);$('timer').textContent=s+'秒';interval=setInterval(()=>{timeLeft--;$('timer').textContent=timeLeft+'秒';if(timeLeft<=0){clearInterval(interval);interval=null;finishTime()}},1000)}function startRecord(){begin('record',20);startTimeMs=Date.now()}function finishCount(){show('resultScreen');$('history').classList.add('hidden');$('result').textContent=`${target}こ ぶったおした！！`}function finishTime(){$('timer').textContent='';clearInterval(interval);interval=null;show('resultScreen');$('history').classList.add('hidden');$('result').textContent=`${count}こ ぶったおした！！`}function comboKey(){return selectedSets.map((v,i)=>v?i:'').filter(v=>v!=='').join('-')}function finishRecord(){clearInterval(interval);interval=null;const sec=Number(((Date.now()-startTimeMs)/1000).toFixed(2)),key='records_'+comboKey();let arr=JSON.parse(localStorage.getItem(key)||'[]');arr.push({date:new Date().toLocaleDateString('ja-JP'),time:sec});arr.sort((a,b)=>a.time-b.time);arr=arr.slice(0,10);localStorage.setItem(key,JSON.stringify(arr));$('result').textContent=`20こ！ ${sec.toFixed(2)}秒！！`;renderHistory(arr);show('resultScreen')}function renderHistory(arr){$('history').classList.remove('hidden');$('history').innerHTML='<b>きろく TOP10</b>'+arr.map((r,i)=>`<div><span>${i+1}位　${r.date}</span><span>${r.time.toFixed(2)}秒</span></div>`).join('')}renderSets();
</script></body></html>
